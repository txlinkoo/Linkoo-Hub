<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkoo Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #030d0d;
            --bg-card: #091f1f;
            --border-color: #123d3d;
            --text-main: #e2e8f0;
            --text-accent: #00e5cf;
        }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: sans-serif; margin: 0; padding-bottom: 90px; display: flex; justify-content: center; }
        .phone-container { width: 100%; max-width: 480px; padding: 20px; box-sizing: border-box; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; margin-bottom: 20px; }
        .card-title { font-size: 0.9rem; font-weight: 600; color: var(--text-accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .pdf-list-container { display: flex; flex-direction: column; gap: 10px; }
        .pdf-item { display: flex; align-items: center; padding: 12px; background: #041010; border: 1px solid var(--border-color); border-radius: 8px; text-decoration: none; color: var(--text-main); font-size: 0.85rem; transition: 0.2s; }
        .pdf-item:hover { border-color: var(--text-accent); }
        .pdf-item i { font-size: 1.2rem; color: #ff4d4d; margin-right: 12px; }
        .pdf-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .download-icon { color: var(--text-accent); font-size: 1rem; }

        /* Navbar */
        .bottom-navbar { position: fixed; bottom: 0; width: 100%; max-width: 480px; background-color: #041010; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-link-item { display: flex; flex-direction: column; align-items: center; color: #527a7a; text-decoration: none; flex: 1; font-size: 0.75rem; gap: 4px; }
        .nav-link-item.active { color: var(--text-accent); font-weight: bold; }
        .nav-link-item i { font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="card-title" style="justify-content: center; font-size: 1.2rem; margin-bottom: 20px;">LINKOO ACADEMY</div>

    <!-- Kotak Dokumen Pembelajaran (Sehingga 10 Slot) -->
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-graduation-cap"></i> Dokumen Pembelajaran (Khas Ahli Spark)</div>
        <div id="pdf-display-list" class="pdf-list-container">
            <!-- Senarai dokumen akan masuk di sini secara dinamik -->
        </div>
    </div>
</div>

<nav class="bottom-navbar">
    <a href="linkoo-info.html" class="nav-link-item"><i class="fa-solid fa-house"></i><span>Utama</span></a>
    <a href="academy.html" class="nav-link-item active"><i class="fa-solid fa-graduation-cap"></i><span>Academy</span></a>
    <a href="dashboard.html" class="nav-link-item"><i class="fa-solid fa-user-gear"></i><span>Admin</span></a>
</nav>

<script>
    window.onload = function() {
        // PENTING: Semakan Keahlian Spark (Aktifkan jika sistem login anda sudah siap)
        // const keahlian = localStorage.getItem('userMembership');
        // if (keahlian !== 'spark') {
        //     alert('Akses Ditolak! Halaman ini hanya untuk Keahlian Spark sahaja.');
        //     window.location.href = 'linkoo-info.html';
        //     return;
        // }

        const pdfContainer = document.getElementById('pdf-display-list');
        
        // Membaca senarai fail PDF daripada localStorage (Array boleh memuatkan lebih 10 fail)
        const pdfs = JSON.parse(localStorage.getItem('pdfFiles')) || [];
        
        if (pdfs.length > 0) {
            pdfs.forEach((pdf, index) => {
                // Memastikan kita memaparkan sehingga had slot atau senarai yang ada
                if (pdf.data && pdf.name) {
                    pdfContainer.innerHTML += `
                        <a href="${pdf.data}" target="_blank" class="pdf-item">
                            <i class="fa-solid fa-file-pdf"></i>
                            <span class="pdf-name">${pdf.name}</span>
                            <i class="fa-solid fa-circle-down download-icon"></i>
                        </a>
                    `;
                }
            });
        } else {
            pdfContainer.innerHTML = "<p style='font-size:0.85rem; color:#527a7a; text-align:center;'>Tiada dokumen pembelajaran buat masa ini.</p>";
        }
    };
</script>

</body>
</html>
