<!DOCTYPE html>
<html>
<body>
    <button id="btn" style="padding: 20px;">UJI PI AUTH</button>
    <div id="log" style="margin-top: 10px; color: blue;"></div>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        const btn = document.getElementById('btn');
        const log = document.getElementById('log');

        btn.addEventListener('click', () => {
            log.innerText = "Butang ditekan...";
            
            // Menggunakan window.Pi secara terus
            if (window.Pi) {
                window.Pi.authenticate(['username'], {})
                .then(user => {
                    alert("Berjaya! Nama: " + user.username);
                })
                .catch(err => {
                    log.innerHTML = "<b style='color:red'>RALAT: " + err + "</b>";
                });
            } else {
                log.innerHTML = "<b style='color:red'>RALAT: SDK Pi tidak dikesan!</b>";
            }
        });
    </script>
</body>
</html>
