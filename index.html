<script>
    async function testPi() {
        // Paparkan mesej "Sedang memproses" pada skrin
        document.getElementById('status').innerText = "Sedang cuba mengesahkan...";
        
        try {
            // Memanggil fungsi Pi Auth
            const user = await window.Pi.authenticate(['username'], {});
            alert("Berjaya! Nama pengguna: " + user.username);
            document.getElementById('status').innerText = "Berjaya!";
        } catch (err) {
            // Jika gagal, tulis ralat ke skrin supaya anda boleh baca
            document.getElementById('status').innerHTML = 
                "<b style='color:red'>RALAT AUTH: " + err.message + "</b><br>" +
                "Sila pastikan anda berada di dalam Pi Browser yang sah.";
        }
    }
</script>

<button onclick="testPi()" style="padding: 20px; font-size: 18px;">UJI PI AUTH</button>
