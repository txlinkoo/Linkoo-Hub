<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Linkoo</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <button onclick="testPi()">Sign in with Pi Browser</button>

    <script>
        // BARIS 17: Inisialisasi
        window.Pi.init({ version: "2.0" });

        // BARIS 20: Fungsi Autentikasi
        async function testPi() {
            try {
                const user = await window.Pi.authenticate(['username'], {});
                alert("Berjaya: " + user.username);
            } catch (err) {
                alert("Ralat SDK: " + err.message);
            }
        }
    </script>
</body>
</html>
