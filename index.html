<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Linkoo</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    </style>
</head>
<body>
    <button onclick="testPi()">Sign in with Pi Browser</button>

    <script>
    alert("Script bermula"); // Uji jika skrip berjalan
    window.Pi.init({ version: "2.0" });
    alert("Pi init selesai"); // Uji jika SDK berjaya init

    async function testPi() {
        alert("Butang ditekan"); // Uji jika butang berfungsi
        try {
            const user = await window.Pi.authenticate(['username'], {});
            alert("Berjaya: " + user.username);
        } catch (err) {
            alert("Ralat: " + err.message);
        }
    }
</script>
</body>
</html>
