<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Linkoo</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <button onclick="testPi()">Sign in with Pi Browser</button>

    <script>
        // BARIS 18: Inisialisasi SDK
        window.Pi.init({ version: "2.0" });

        // BARIS 21: Fungsi Autentikasi
        async function testPi() {
            try {
                // Meminta kebenaran autentikasi
                const user = await window.Pi.authenticate(['username'], {});
                alert("Berjaya: " + user.username);
            } catch (err) {
                // Jika gagal, mesej ralat akan dipaparkan
                alert("Ralat SDK: " + err.message);
            }
        }
    </script>
</body>
</html>
