<script>
    // Fungsi untuk memaparkan log di skrin (supaya anda boleh baca tanpa PC)
    function log(msg) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        document.body.appendChild(div);
    }

    log("Script bermula...");

    // Cek jika Pi SDK wujud
    if (typeof Pi === 'undefined') {
        log("<b style='color:red'>RALAT: Pi SDK tidak dimuatkan!</b>");
    } else {
        log("Pi SDK dikesan.");
        window.Pi.init({ version: "2.0" });
    }

    async function testPi() {
        try {
            log("Mencuba autentikasi...");
            const user = await window.Pi.authenticate(['username'], {});
            alert("Berjaya: " + user.username);
        } catch (err) {
            log("<b style='color:red'>RALAT SDK: " + err.message + "</b>");
        }
    }
</script>
