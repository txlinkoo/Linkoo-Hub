<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKOO Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS DIBETULKAN UNTUK BUANG GARISAN PUTIH */
        html, body { width: 100%; margin: 0; padding: 0; overflow-x: hidden; background-color: #030d0d; font-family: sans-serif; color: #e2e8f0; }
        * { box-sizing: border-box; }
        .phone-container { width: 100%; max-width: 480px; margin: 0 auto; background-color: #051414; min-height: 100vh; position: relative; padding-bottom: 80px; }
        
        /* FIX FLYER AGAR TIDAK MELIMPAH */
        .flyer-wrapper { display: flex; gap: 12px; overflow-x: auto; padding: 16px; width: 100%; }
        .flyer-box { min-width: 120px; flex: 0 0 120px; background: #0d2e2e; border-radius: 10px; padding: 6px; }
        .flyer-box img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        
        /* Gaya Asal Anda Dikekalkan */
        .app-header { background: linear-gradient(135deg, #026666, #00a896); padding: 25px; text-align: center; }
        .card { background-color: #091f1f; margin: 16px; padding: 15px; border-radius: 14px; }
        .btn-pi-auth { background-color: #57127b; color: white; width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="app-header">
            <h1>LINKOO</h1>
            <p>Store With Cash Back</p>
        </header>

        <div class="app-content">
            <button class="btn-pi-auth" id="btnPiSignIn" onclick="authPiNetwork()">
                <i class="fa-solid fa-wallet"></i> Sign-In with Pi Browser
            </button>

            <div class="flyer-wrapper">
                <div class="flyer-box"><img src="https://i.postimg.cc/ydtJ1CVD/IMG-20260614-WA0043.jpg"><span>Miliki Kedai</span></div>
                <div class="flyer-box"><img src="https://i.postimg.cc/x8mXqpCq/IMG-20260614-WA0056.jpg"><span>Pensyarah</span></div>
                <div class="flyer-box"><img src="https://i.postimg.cc/4dqKfRJz/IMG-20260614-WA0058.jpg"><span>Social E-Com</span></div>
            </div>

            <div class="card">
                <div class="tone-wow-box">
                    <h3 style="color: #ffcc00;">PROMOSI SIM KAD TONE WOW</h3>
                    <a href="https://wa.me/601164632409" class="btn-whatsapp" style="display:block; background:#12cc62; color:white; padding:12px; border-radius:10px; text-decoration:none;">Klik WhatsApp</a>
                </div>
            </div>
        </div>

        <nav class="bottom-navbar" style="position:fixed; bottom:0; width:100%; max-width:480px; background:#041010; display:flex; justify-content:space-around; padding:12px; border-top:1px solid #123d3d;">
            <a href="index.html" style="color:white; text-decoration:none;">Utama</a>
            <a href="academy.html" style="color:white; text-decoration:none;">Academy</a>
        </nav>
    </div>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        // FUNGSI PI ASAL ANDA
        async function authPiNetwork() {
            const btn = document.getElementById('btnPiSignIn');
            try {
                const auth = await Pi.authenticate(['username'], (p) => {}, () => {});
                alert("Selamat Datang, " + auth.user.username);
                btn.innerText = auth.user.username;
            } catch (err) { alert("Sila guna Pi Browser."); }
        }
    </script>
</body>
</html>
