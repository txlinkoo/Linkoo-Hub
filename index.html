<!DOCTYPE html>
<html>
<body>
    <h1>Ujian Autentikasi</h1>
    <button id="authBtn" style="padding: 20px;">UJI PI AUTH</button>
    <div id="debug" style="margin-top: 20px; color: red; font-family: monospace;"></div>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        const debugDiv = document.getElementById('debug');
        
        // Fungsi untuk tulis ralat ke skrin
        function showDebug(msg) {
            debugDiv.innerHTML += msg + "<br>";
        }

        document.getElementById('authBtn').addEventListener('click', async () => {
            showDebug("Butang ditekan. Memulakan...");
            try {
                if (typeof Pi === 'undefined') {
                    throw new Error("SDK Pi tidak dimuatkan!");
                }
                
                showDebug("Memanggil Pi.init()...");
                await window.Pi.init({ version: "2.0" });
                
                showDebug("Memanggil Pi.authenticate()...");
                const user = await window.Pi.authenticate(['username'], {});
                
                alert("Berjaya! Username: " + user.username);
                showDebug("Berjaya!");
            } catch (err) {
                showDebug("RALAT: " + err.message);
                console.error(err);
            }
        });
    </script>
</body>
</html>
